name: Validate V2 Branch Radar
on:
  pull_request:
    paths:
      - 'radar/**'
      - 'tests/**'
      - '.github/workflows/ci-v2.yml'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m compileall -q radar